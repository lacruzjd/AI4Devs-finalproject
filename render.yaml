# ═══════════════════════════════════════════════════════════════════════════════
# RestoStock — Blueprint de Render (TK-142, decidido en ADR-006)
#
# ⚠️ Carve-out explícito del Guard 22 (documentado en ADR-006 §3 y en
#    docs/00_stack_manifest.md §6): el Guard exige OpenTofu, y esto es el formato
#    declarativo nativo de Render. Cumple el espíritu (declarativo, versionado,
#    revisable) pero no la letra. NO es una excepción silenciosa.
#    `infrastructure/opentofu/` sigue siendo la IaC del stack local/Docker.
#
# ⚠️ NO VERIFICADO contra Render real desde el entorno de desarrollo
#    (rules/04_verified_implementation_standard.md, Antipatrón B). Los nombres de
#    campo y el direccionamiento entre servicios deben confirmarse contra la
#    documentación vigente de Render en el primer despliegue. Ver "Verificación
#    pendiente" al final.
#
# ── Por qué esta topología ─────────────────────────────────────────────────────
# apps/frontend/src/shared/http/apiClient.ts fija `/api/v1` RELATIVO: el cliente
# asume que la API vive en su mismo origen. Ese mismo origen es la fuerza decisiva
# de ADR-005 (cookie httpOnly) y lo que permite `connect-src 'self'` en la CSP de
# TK-141. Por eso el frontend se despliega como su IMAGEN DOCKER (que lleva nginx
# dentro) y nginx hace de proxy inverso hacia el backend — no como Static Site.
#
# El navegador solo habla con el frontend. La llamada frontend→backend es
# servidor a servidor, así que el mismo origen se conserva.
# ═══════════════════════════════════════════════════════════════════════════════

databases:
  - name: restostock-db
    databaseName: restostock
    user: restostock
    plan: basic-256mb   # ⚠️ confirmar el nombre exacto del plan en el dashboard
    region: oregon

# Rama desplegada: `main`. Es la rama desplegable por convención, y tras fusionar la
# entrega queda idéntica a `finalproject-JDLM`. Un push a `main` redespliega solo.
services:
  # ── Backend (Private Service — NO expuesto a internet) ────────────────────────
  # Restaura la decisión original de ADR-006. Estuvo como `web` solo mientras el
  # despliegue iba en plan gratuito, donde los private services no existen; esa
  # desviación quedó declarada en el ADR y ahora se revierte.
  # La única puerta pública es el SPA; el backend solo es alcanzable desde él.
  - type: pserv
    name: restostock-backend
    runtime: docker
    repo: https://github.com/lacruzjd/AI4Devs-finalproject
    branch: main
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # Sin `healthCheckPath`: Render lo rechaza en un `pserv` ("pserv service type cannot
    # have a health check path") — los private services no reciben tráfico externo, así
    # que no hay health check HTTP que hacerles. El endpoint `/health` sigue existiendo en
    # la RAÍZ (no bajo /api/v1) y es alcanzable desde el frontend por la red interna.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: restostock-db
          property: connectionString
      # Guard 14: sin estas el arranque aborta. ENCRYPTION_KEY debe DIFERIR de
      # JWT_SECRET (AUDIT-SEC-004 F-1) — `generateValue` da un valor distinto a cada una.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # 🔴 OBLIGATORIA: sin ella `seedProductionAdmin` omite el bootstrap y NO SE CREA
      # NINGÚN ADMINISTRADOR — nadie podría entrar. `sync: false` = se define a mano
      # en el dashboard, nunca en el repo.
      - key: SEED_ADMIN_PIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      # Origen público del frontend: allowlist de CORS y enlace del email de reset
      # (AUDIT-SEC-004 F-2 — el header Origin nunca se confía si no está aquí).
      #
      # Valor LITERAL por la MISMA razón que BACKEND_ORIGIN: `property: host` devuelve
      # el hostname pelado, sin esquema. El despliegue #2 abortó con
      #   Guard 14: "CLIENT_ORIGIN debe ser una URL válida"
      # porque `environment.ts` lo valida con `z.string().url()`. CORS_ALLOWED_ORIGINS
      # no reventó —es `z.string()` sin validar— pero habría roto el CORS en silencio,
      # que es peor. Los dos se fijan enteros, con esquema.
      #
      # ⚠️ Si Render asigna al frontend un hostname distinto (por colisión de nombre),
      # corregir AMBOS aquí con la URL real que muestre el dashboard.
      - key: CORS_ALLOWED_ORIGINS
        value: https://restostock-frontend.onrender.com
      - key: CLIENT_ORIGIN
        value: https://restostock-frontend.onrender.com
      # El private service escucha en su puerto interno; Render inyecta PORT.
      - key: PORT
        value: 3000

  # ── Frontend (única puerta pública prevista) ──────────────────────────────────
  - type: web
    name: restostock-frontend
    runtime: docker
    repo: https://github.com/lacruzjd/AI4Devs-finalproject
    branch: main
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      # TK-142: sustituye el alias `backend` de docker-compose, inexistente aquí.
      #
      # Valor LITERAL, no `fromService`. El primer despliegue falló con
      #   nginx: [emerg] invalid URL prefix in /etc/nginx/conf.d/default.conf:79
      # porque `property: hostport` devuelve `restostock-backend:3000` SIN esquema y
      # `proxy_pass` exige `http://`. render.yaml no permite concatenar un literal con
      # una referencia `fromService`, así que se fija entero: el nombre del servicio
      # privado está declarado en este mismo fichero, luego es determinista.
      # `http`, no `https`: la red interna de Render no lleva TLS entre servicios.
      - key: BACKEND_ORIGIN
        value: http://restostock-backend:3000
      # Render enruta al puerto que la imagen expone; 8080 es el de EXPOSE.
      - key: NGINX_PORT
        value: 8080

# ═══════════════════════════════════════════════════════════════════════════════
# Verificación pendiente en el primer despliegue (DoD de TK-142)
#
# 1. ✅ RESUELTO en el primer despliegue (2026-09-09). `property: hostport` devuelve
#    `host:puerto` SIN esquema y nginx abortó al arrancar con
#      nginx: [emerg] invalid URL prefix in /etc/nginx/conf.d/default.conf:79
#    (la línea del `proxy_pass`). No fue un 502 como preví: el contenedor ni siquiera
#    llega a servir — falla en el arranque, que es preferible a fallar en caliente.
#    BACKEND_ORIGIN pasa a valor literal con esquema.
# 1b. ✅ MISMA CAUSA, segundo despliegue: el backend abortó con
#      Guard 14: "CLIENT_ORIGIN debe ser una URL válida"
#    `property: host` devuelve el hostname pelado y `environment.ts` valida con
#    `z.string().url()`. CORS_ALLOWED_ORIGINS compartía el defecto sin dar la cara
#    (es `z.string()` sin validar) — habría roto el CORS en silencio, peor que el
#    fallo ruidoso. Los dos pasan a literal con `https://`.
#
#    LECCIÓN: en este blueprint, NINGUNA referencia `fromService` sirve donde se
#    espera una URL — `host` y `hostport` devuelven siempre valores sin esquema.
#    Antes de añadir una variable nueva de tipo URL, usar valor literal.
# 1b. Nombres de plan (`starter`, `basic-256mb`): confirmar contra el dashboard, la
#    nomenclatura de Render cambia con el tiempo y NO esta verificada desde aqui.
# 2. ⏳ SIN VERIFICAR: que el rate limiter no agrupe a todos los clientes en un mismo
#    bucket. `trust proxy` está en ['loopback','linklocal','uniquelocal'] y la red de
#    Render podría no caer en rango privado — sería el bug que cerró TK-132. Requiere
#    dos clientes con IP pública distinta golpeando el login; no comprobado.
# 3. ✅ Verificado el 2026-09-09 contra el despliegue real:
#      GET /            → 200
#      GET /estaciones  → 200 (fallback del SPA, no 404)
#      GET /api/v1/stock/insumos → 401  ← la señal que importa: el proxy LLEGA al
#                         servicio privado y el backend exige auth. Un 502 habría
#                         significado que nginx no alcanza el backend.
#      Las 5 cabeceras de TK-141 presentes bajo HTTPS.
#    El recorrido funcional en navegador (login, extracción, FEFO) lo confirmó el humano.
# 4. ⏳ PARCIAL: `camera=(self)` está presente en la respuesta, que es la condición
#    necesaria para US-032 bajo HTTPS. El escaneo real con una cámara no se probó.
# 5. Plan de pago (starter): sin suspensión por inactividad ni caducidad de la base,
#    así que el revisor no se encuentra un arranque en frío. Confirmar el gasto
#    mensual en el dashboard antes de dejarlo corriendo más allá de la revisión.
# ═══════════════════════════════════════════════════════════════════════════════
